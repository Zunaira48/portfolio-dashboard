<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Login Test (Dev Only)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="font-family: sans-serif; padding: 40px;">
  <h2>Portfolio Admin — Dev Login Test</h2>
  <p>This page exists only to test Google Sign-In + backend verification before the real dashboard is built.</p>

  <div id="g_id_onload"
       data-client_id="200170144298-vktfg954tqn5kh9t2ircme4uto9ss5kh.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <pre id="result" style="margin-top:20px; background:#eee; padding:10px;"></pre>

  <script>
    async function handleCredentialResponse(response) {
      const result = document.getElementById('result');
      result.textContent = 'Verifying with backend...';

      const res = await fetch('http://localhost:5216/api/admin/auth/verify', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: response.credential })
      });

      const data = await res.json();
      result.textContent = `Status: ${res.status}\n` + JSON.stringify(data, null, 2);
    }

    async function checkMe() {
      const res = await fetch('http://localhost:5216/api/admin/auth/me', { credentials: 'include' });
      const data = await res.json();
      document.getElementById('result').textContent = `/me → Status: ${res.status}\n` + JSON.stringify(data, null, 2);
    }
  </script>

  <button onclick="checkMe()" style="margin-top:10px;">Check /me (should work after sign-in)</button>
</body>
</html>
